<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04050a" />
    <title>BATERDENE.EXE — Still Becoming</title>
    <meta name="description" content="You know my name. Not my universe. — Б.Бат-Эрдэнийн interactive 3D ертөнц." />
    <meta property="og:title" content="BATERDENE.EXE" />
    <meta property="og:description" content="You know my name. Not my universe." />
    <meta property="og:image" content="assets/images/profile.png" />
    <link rel="icon" href="assets/images/image1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=Manrope:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/world.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="is-booting">
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>
    <div class="fx-flash" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"><span></span></div>

    <!-- SYSTEM BOOT -->
    <div id="boot" role="dialog" aria-label="Loading">
      <div class="boot-inner">
        <div class="boot-log mono" id="bootLog"></div>
        <div class="boot-bar"><i id="bootBar"></i></div>
        <div class="boot-title">BATERDENE<span>.EXE</span></div>
        <p class="boot-tag mono">You know my name. Not my universe.</p>
        <div class="boot-actions">
          <button class="btn-enter" id="enterSound"><span>Нэвтрэх</span><small class="mono">🎧 ДУУТАЙ</small></button>
          <button class="btn-ghost mono" id="enterSilent">дуугүй нэвтрэх</button>
        </div>
      </div>
    </div>

    <!-- HUD -->
    <header class="hud">
      <a href="#awaken" class="hud-logo mono" data-goto="0"><i class="dot"></i>BATERDENE<b>.EXE</b></a>
      <div class="hud-chapter mono" aria-live="polite">
        <span id="chapNum">00</span><span class="sep">/</span><span id="chapName">BOOT</span>
      </div>
      <div class="hud-right">
        <div class="frag-slots mono" id="fragSlots" title="◆"><i></i><i></i><i></i><i></i></div>
        <button class="hud-btn lang mono" id="langBtn" aria-label="Language">EN</button>
        <button class="hud-btn" id="soundBtn" aria-label="Sound"><span class="eq"><i></i><i></i><i></i><i></i></span></button>
        <button class="hud-btn" id="menuBtn" aria-label="Menu"><span class="burger"><i></i><i></i></span></button>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <div class="progress-line"><i id="progressLine"></i></div>

    <div id="menu" aria-hidden="true">
      <div class="menu-inner">
        <p class="mono menu-label">// NAVIGATE THE UNIVERSE</p>
        <ol id="menuList"></ol>
        <a class="mono menu-classic" href="classic.html">↗ classic view</a>
      </div>
    </div>

    <!-- tapped trait card (3D words around the core) -->
    <div id="traitCard" class="mono" role="status" aria-live="polite"></div>

    <main id="story">
      <section class="scene scene-hero" id="awaken" data-name="BATERDENE.EXE">
        <div class="hero-wrap">
          <p class="mono kicker reveal">[ SYSTEM ONLINE ]</p>
          <h1 class="hero-title reveal"><span>BATERDENE</span><span class="accent">.EXE</span></h1>
          <p class="hero-sub reveal" data-t="heroSub"></p>
          <p class="hero-line reveal">You know my name.<br /><em>Not my universe.</em></p>
          <p class="hero-trans reveal" data-t="heroTrans"></p>
          <p class="cycler mono reveal" id="cycler"></p>
        </div>
        <button class="scroll-hint mono" data-goto="1"><span data-t="hint"></span><i></i></button>
      </section>

      <section class="scene chapter side-r" id="who" data-name="WHO AM I"></section>
      <section class="scene chapter side-l" id="mind" data-name="INSIDE MY MIND"></section>
      <section class="scene chapter scene-builder" id="builder" data-name="THE BUILDER"></section>
      <section class="scene chapter center" id="quiet" data-name="MY QUIET WORLD"></section>
      <section class="scene chapter side-r" id="values" data-name="WHAT MATTERS"></section>
      <section class="scene chapter side-l" id="record" data-name="THE RECORD"></section>
      <section class="scene chapter side-r" id="path" data-name="MY OWN PATH"></section>

      <section class="scene chapter side-l" id="unknown" data-name="UNKNOWN">
        <div class="vault reveal" id="vault">
          <p class="mono kicker danger" data-t="vault.kicker"></p>
          <h2 class="vault-title" data-t="vault.title"></h2>
          <p class="body-p" data-t="vault.lead"></p>
          <p class="mono dim" data-t="vault.hint"></p>
          <form class="code-form" id="codeForm" autocomplete="off">
            <div class="code-boxes">
              <input inputmode="numeric" maxlength="1" aria-label="1" />
              <input inputmode="numeric" maxlength="1" aria-label="2" />
              <input inputmode="numeric" maxlength="1" aria-label="3" />
              <input inputmode="numeric" maxlength="1" aria-label="4" />
            </div>
            <button class="btn-enter small" type="submit"><span>DECRYPT</span></button>
          </form>
          <p class="mono vault-status" id="vaultStatus">STATUS: LOCKED</p>
          <div class="secret-out" id="secretOut" hidden></div>
        </div>
      </section>

      <section class="scene chapter side-l scene-end" id="becoming" data-name="STILL BECOMING"></section>
    </main>

    <!-- Project sheet -->
    <div id="sheet" aria-hidden="true">
      <div class="sheet-backdrop" data-close></div>
      <article class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <span class="sheet-grip" aria-hidden="true"></span>
        <button class="sheet-close" data-close aria-label="Close">✕</button>
        <div class="sheet-media"><img id="sheetImg" alt="" /></div>
        <div class="sheet-body">
          <p class="mono kicker" id="sheetCode"></p>
          <h3 id="sheetTitle"></h3>
          <div class="badges" id="sheetBadges"></div>
          <p id="sheetDesc"></p>
          <div class="stack mono" id="sheetStack"></div>
          <div class="sheet-actions">
            <button class="btn-enter small" id="sheetDoc"><span>PDF ↗</span></button>
            <a class="btn-ghost mono" href="https://github.com/Bat-BBE" target="_blank" rel="noopener">GitHub ↗</a>
          </div>
        </div>
      </article>
    </div>

    <!-- PDF viewer (desktop) -->
    <div id="pdf" aria-hidden="true">
      <div class="pdf-card">
        <header>
          <span class="mono" id="pdfTitle">PDF</span>
          <div>
            <a class="mono" id="pdfOpen" target="_blank" rel="noopener">↗</a>
            <button data-close aria-label="Close">✕</button>
          </div>
        </header>
        <iframe id="pdfFrame" title="PDF"></iframe>
      </div>
    </div>

    <!-- Photo lightbox -->
    <div id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <figure>
        <img id="lbImg" alt="" />
        <figcaption id="lbCap"></figcaption>
      </figure>
      <button class="lb-close" aria-label="Close">✕</button>
    </div>

    <div id="toast" class="mono" role="status"></div>
    <noscript><p style="padding: 40px; color: #fff">JavaScript шаардлагатай. <a href="classic.html">Classic view</a></p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
